name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EcoCashForwarder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK to the apk-latest branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/
          cd /tmp/out && git init -q -b apk-latest
          git config user.name "build" && git config user.email "build@users.noreply.github.com"
          git add app-debug.apk && git commit -qm "APK build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-latest
